name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - "firebase-functions/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "firebase-functions/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Run firebase-functions test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: firebase-functions/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix firebase-functions

      - name: Set up Java 21 (required by Firebase emulators)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Run tests
        run: npm --prefix firebase-functions test
