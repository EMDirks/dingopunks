<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dingo Punks — All-Access Membership</title>
  <link rel="stylesheet" href="https://use.typekit.net/wkn1qca.css" />
  <link rel="stylesheet" href="css/membership.css" />
</head>
<body>
  <div class="dpaam">
    <header class="dpaam-topbar">
      <div class="dpaam-brand">
        <img
          class="dpaam-logo"
          src="assets/branding/logo/logo-main.png"
          alt="Dingo Punks"
          width="800"
          height="373"
        />
        <span class="dpaam-pill">All-Access Membership</span>
      </div>
      <button type="button" class="dpaam-account-btn">My account</button>
    </header>

    <main class="dpaam-main">
      <!-- Section 1: Active Codes -->
      <section class="dpaam-section" id="dpaam-active-section" aria-labelledby="dpaam-active-heading">
        <div class="dpaam-section-header">
          <h2 id="dpaam-active-heading" class="dpaam-section-title">Active Codes</h2>
          <span class="dpaam-active-count" id="dpaam-active-count">0 / 12 active</span>
        </div>
        <div class="dpaam-active-list" id="dpaam-active-list" role="list"></div>
      </section>

      <!-- Section 2: My Favorites -->
      <section class="dpaam-section" aria-labelledby="dpaam-favorites-heading">
        <div class="dpaam-section-header">
          <button
            type="button"
            class="dpaam-favorites-toggle"
            id="dpaam-favorites-toggle"
            aria-expanded="false"
            aria-controls="dpaam-favorites-list"
          >
            <span class="dpaam-toggle-chevron" aria-hidden="true">▸</span>
            <h2 id="dpaam-favorites-heading" class="dpaam-section-title">Favorites</h2>
          </button>
          <span class="dpaam-favorites-count" id="dpaam-favorites-count">0 favorites</span>
        </div>
        <ul class="dpaam-favorites-list" id="dpaam-favorites-list" hidden></ul>
      </section>

      <!-- Section 3: Library -->
      <section class="dpaam-section" aria-labelledby="dpaam-library-heading">
        <div class="dpaam-section-header">
          <h2 id="dpaam-library-heading" class="dpaam-section-title">Library</h2>
          <span class="dpaam-library-count" id="dpaam-library-count"></span>
        </div>

        <div class="dpaam-filters" id="dpaam-filters">
          <label class="dpaam-filter">
            <span class="dpaam-filter-label">Season</span>
            <select id="dpaam-filter-season" data-filter="season"></select>
          </label>
          <label class="dpaam-filter">
            <span class="dpaam-filter-label">Grade</span>
            <select id="dpaam-filter-grade" data-filter="grade"></select>
          </label>
          <label class="dpaam-filter">
            <span class="dpaam-filter-label">Subject</span>
            <select id="dpaam-filter-subject" data-filter="subject"></select>
          </label>
        </div>

        <ul class="dpaam-library-list" id="dpaam-library-list"></ul>
        <p class="dpaam-empty" id="dpaam-library-empty" hidden>
          No games match those filters.
        </p>
      </section>
    </main>

    <!-- Detail modal -->
    <dialog class="dpaam-modal" id="dpaam-modal" aria-labelledby="dpaam-modal-title">
      <form method="dialog" class="dpaam-modal-form">
        <header class="dpaam-modal-header">
          <h3 class="dpaam-modal-title" id="dpaam-modal-title"></h3>
          <button type="submit" class="dpaam-modal-close" value="cancel" aria-label="Close">×</button>
        </header>
        <dl class="dpaam-modal-body" id="dpaam-modal-body"></dl>
        <footer class="dpaam-modal-footer">
          <button type="button" class="dpaam-btn" id="dpaam-modal-preview">
            View Preview
          </button>
          <button type="button" class="dpaam-btn dpaam-btn-primary" id="dpaam-modal-add">
            + Favorite
          </button>
        </footer>
      </form>
    </dialog>
  </div>

  <script type="module" src="js/membership.js"></script>
</body>
</html>
