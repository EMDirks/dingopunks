<!DOCTYPE html>
<html lang="en">

	<head>

		<!-- prevent indexing -->
		<meta name="robots" content="noindex, nofollow">

		<!-- page information -->
		<title>Enter the Undermurk! | Dingo Punks</title>
		<meta name="description" content="Enter the Undermurk in Dingo Punks' arcade-style vocab minigame."/>

		<!-- meta tags -->
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

		<!-- css files -->
		<link type="text/css" rel="stylesheet" href="css/splash.css?version=3.4.51">
		<link type="text/css" rel="stylesheet" href="css/splash-new.css?version=3.4.51">
		<link type="text/css" rel="stylesheet" href="css/global.css?version=3.4.51">
		<link type="text/css" rel="stylesheet" href="css/enter-the-undermurk.css?version=3.4.51">

		<!-- favicon -->
		<link rel="icon" type="image/png" sizes="192x192" href="assets/website/favicon-192x192.png">

	</head>

	<body>

		<!-- device rotation -->
		<div class = "div-rotate">
			<div class = "div-rotate-content">
				<img class = "img-rotate" src = "assets/website/rotate-device-example.png" alt = "example of a device in landscape mode">
				<p class = "p-rotate"><span class = "p-rotate--gold">Rotate your device!</span> Dingo Punks works best in landscape mode.</p>
			</div>
		</div>

		<button class="button-menu-global">Menu</button>

		<!-- website container -->
		<div class = "site-container">

			<!-- modal -->
			<section class = "modal modal--hidden">
				<div class = "modal__popup modal__popup--hidden">
					<p class = "modal__x">&#x2715</p>
					<p class = "modal__title"></p>
					<p class = "modal__paragraph"></p>
					<div class = "modal__actions">
						<div class = "modal-version"></div>
						<button class = "modal__button"></button>
					</div>
				</div>
				<div class = "modal__blackout modal__blackout--hidden"></div>
			</section>

			<!-- splash -->
			<section class = "splash splash--visible">
				<div class = "splash-container-wrapper">
				</div>
			</section>

			<!-- footer -->
			<section class = "footer footer--hidden">
				<div class = "footer-element footer-element-timer--visible" id = "footer-element-timer">
					<p class = "footer-element-time-label"></p>
					<p class = "footer-element-time-remaining">&nbsp</p>
				</div>
			</section>

			<!-- activity (present so global.js element lookups resolve; hidden) -->
			<section class = "activity state-display-none">
				<div class = "activity-modal activity-modal--close">
					<div class = "activity-modal-wrapper overflow-y-scroll"></div>
					<button class = "button-close-modal" ontouchstart></button>
				</div>
				<div class = "activity-blackout activity-blackout--close"></div>
				<div class = "keyboard"></div>
			</section>

			<!-- nodes -->
			<div class = "activity-node-container state-display-none"></div>

		</div>

		<!-- scripts -->
		<div id = "script-resource"></div>
		<div id = "script-cutscene"></div>
		<script type="text/javascript" src="js/config.js?version=3.4.51"></script>
		<script type="text/javascript" src="js/global.js?version=3.4.51"></script>
		<script type="text/javascript" src="js/global-menu.js?version=3.4.51"></script>
		<script type="text/javascript" src="js/splash-new.js?version=3.4.51"></script>
		<script type="text/javascript" src="js/enter-the-undermurk.js?version=3.4.51"></script>

	</body>

</html>
